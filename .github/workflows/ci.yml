name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Os testes usam o perfil "test" (H2 em memória): não precisam de Postgres nem de segredos
      - name: Run tests
        run: ./mvnw -B test
