# Perfil "test": banco H2 em memória (modo PostgreSQL) e segredos falsos, para "mvn test" rodar sem Docker nem variáveis
spring.datasource.url=jdbc:h2:mem:vacancy_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

security.token.secret=test-secret-company
security.token.secret.candidate=test-secret-candidate
