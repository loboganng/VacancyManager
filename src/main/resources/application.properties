spring.application.name=vacancy_manager

# Porta: o Render (e outros PaaS) informam a porta pela variável PORT
server.port=${PORT:8080}

# Banco de dados: variáveis de ambiente no deploy; os valores padrão servem para o Postgres local do docker-compose
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gestao_vagas}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin}

# Segredos JWT: vêm de variáveis de ambiente ou do arquivo local secrets.properties (fora do git)
spring.config.import=optional:file:./secrets.properties

# Hibernate configuration
# Informa ao Hibernate para atualizar e gerenciar o BD automaticamente, criando as tabelas necessárias com base nas entidades definidas no código.
spring.jpa.hibernate.ddl-auto=update

# Secret key para geração de tokens JWT para a empresa
security.token.secret=${JWT_SECRET}

# Secret key para geração do token JWT para o candidato
security.token.secret.candidate=${JWT_SECRET_CANDIDATE}
