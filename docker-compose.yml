services:
  postgres:
    container_name: gestao_vagas_postgres
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gestao_vagas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gestao_vagas"]
      interval: 5s
      retries: 10

  # API: só sobe com "docker compose --profile app up --build".
  # Sem o profile, sobe apenas o Postgres (para rodar a API pela IDE ou pelo ./mvnw).
  api:
    profiles: ["app"]
    build: .
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/gestao_vagas
      - DATABASE_USERNAME=admin
      - DATABASE_PASSWORD=admin
    # JWT_SECRET e JWT_SECRET_CANDIDATE vêm do arquivo .env (copie de .env.example)
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
